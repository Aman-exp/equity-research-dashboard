name: XBRL fundamentals ingestion

# The centerpiece of reducing manual entry: quarterly results land as
# unverified rows for one-tap confirmation instead of hand transcription.
# Source: /api/integrated-filing-results (the CURRENT endpoint — the legacy
# corporates-financial-results API is frozen at Jan-2025; see build spec 8a).
#
# Daily rather than weekly: results cluster around quarter-ends and the review
# inbox is most useful the day a filing lands. Idempotent — re-runs skip
# already-ingested filings by source_url, so daily runs are nearly free.
#
# Required secret: SUPABASE_DB_URL — Supabase SESSION POOLER string, port 5432
# (the direct connection is IPv6-only on the free tier and unreachable from
# GitHub's IPv4-only runners). See docs/phase0-setup.md step 1.

on:
  schedule:
    - cron: '30 20 * * *'        # 20:30 IST daily; board meetings can be any day
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

concurrency:
  # SHARED ACROSS ALL FOUR NSE-TOUCHING WORKFLOWS. NSE rate-limits by source, and
  # GitHub runners are datacenter IPs, so two of these jobs running at once
  # throttle each other — observed 2026-08-22, when an EOD backfill and the XBRL
  # job collided and NSE served HTML pages with HTTP 200 to both.
  #
  # cancel-in-progress: false, so a job WAITS rather than killing the one already
  # talking to NSE. Note GitHub keeps only ONE pending run per group: if two runs
  # queue behind a long backfill, the earlier pending one is cancelled. In normal
  # operation the schedules are 90+ minutes apart and never collide, so this only
  # matters during a manual backfill — run those outside 20:00-21:15 IST, or
  # re-trigger anything the Actions tab shows as cancelled. Every job here is
  # self-healing on the next run, so a skipped one loses nothing permanently.
  group: nse-api
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Ingest quarterly XBRL filings
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/fetch_fundamentals.py

# Failure paths all surface on the dashboard banner via job_failures:
#   - a whole-job exception
#   - an XBRL file 404 on the archive host (seen in the wild: L&T Mar-2025)
#   - a revised filing that differs from a row the user already CONFIRMED
#     (never overwritten silently — restatements need human eyes)
#   - an ISIN mismatch between the filing and `companies` (possible drift)
