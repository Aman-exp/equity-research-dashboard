name: Nightly database backup

# Phase 0 requirement — set up now, not later. This database becomes years of
# irreplaceable, manually-entered research; it is the single most important
# automation in the project.
#
# Dumps Postgres, gzips, and commits into a SEPARATE PRIVATE backup repo.
#
# Required secrets (repo settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL    Supabase SESSION POOLER connection string, port 5432:
#                        postgresql://postgres.<ref>:<pw>@aws-<region>.pooler.supabase.com:5432/postgres
#                      NOT the direct connection: on the free tier that resolves to
#                      IPv6 only, and GitHub Actions runners are IPv4-only, so it
#                      fails with "Network is unreachable". NOT the transaction
#                      pooler (port 6543) either — pg_dump needs session mode.
#                      Service-level credential: GitHub Secrets only, never committed.
#   BACKUP_REPO        owner/name of the private backup repo, e.g. Aman-exp/equity-research-backups
#   BACKUP_REPO_TOKEN  PAT with `repo` scope on that backup repo.

on:
  schedule:
    - cron: '30 2 * * *'          # 02:30 IST nightly — well clear of market hours
      timezone: 'Asia/Kolkata'
  workflow_dispatch:              # always available for manual testing

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d)
          mkdir -p out
          # pg_dump runs from a pinned client image so the dump never breaks from a
          # client/server version mismatch. A newer pg_dump can dump an older server.
          docker run --rm postgres:17-alpine \
            pg_dump "$DB_URL" \
              --no-owner --no-privileges \
              --schema=public \
            | gzip -9 > "out/db-${STAMP}.sql.gz"
          ls -lh out/
          # Fail loudly if the dump is suspiciously small (empty/error output).
          SIZE=$(stat -c%s "out/db-${STAMP}.sql.gz")
          if [ "$SIZE" -lt 1000 ]; then
            echo "Dump is only ${SIZE} bytes — treating as failed." >&2
            exit 1
          fi

      - name: Check out backup repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Commit dump and prune old ones
        run: |
          set -euo pipefail
          cd backup-repo
          mkdir -p dumps
          cp ../out/*.sql.gz dumps/

          # Retention: keep every dump from the last 30 days, then one per month
          # (the earliest surviving dump in each month) for everything older.
          #
          # CAVEAT: deleting files here does NOT shrink the repo — git retains every
          # blob ever committed. Pruning keeps the working tree tidy and clone-time
          # checkout small, but repo size still grows monotonically. At this data
          # volume (a few MB of numeric research) that is fine for many years; if it
          # ever matters, the fix is rewriting history, not more aggressive pruning.
          python3 - <<'PY'
          import os, re, datetime, subprocess
          d = 'dumps'
          files = sorted(f for f in os.listdir(d) if re.match(r'db-\d{8}\.sql\.gz$', f))
          today = datetime.date.today()
          keep, seen_months = set(), set()
          for f in files:
              day = datetime.datetime.strptime(f[3:11], '%Y%m%d').date()
              if (today - day).days <= 30:
                  keep.add(f)
              else:
                  m = (day.year, day.month)
                  if m not in seen_months:
                      seen_months.add(m)
                      keep.add(f)
          for f in files:
              if f not in keep:
                  print('pruning', f)
                  subprocess.run(['git', 'rm', '-q', os.path.join(d, f)], check=True)
          PY

          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add dumps
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Backup $(date -u +%Y-%m-%d)"
            git push
          fi

      # ----------------------------------------------------------------------
      # Failure alerting.
      #
      # This job is the single most important automation in the project, and it
      # was the only one that failed SILENTLY: GitHub does not notify on failed
      # scheduled workflows, and the dashboard banner is the project's only
      # alerting mechanism (CLAUDE.md: "every job writes to job_failures on
      # exception"). The likely failures are all slow-rot: BACKUP_REPO_TOKEN
      # expiring, the DB password rotating, the backup repo being renamed, or
      # branch protection appearing on its main. Any of those would stop backups
      # of irreplaceable research every night, indefinitely, unnoticed.
      #
      # DEDUPED ON PURPOSE. This job runs nightly, so an unconditional INSERT
      # would add a row every night and the banner would become noise the user
      # learns to scroll past — the same failure mode the XBRL-404 path already
      # guards against in fetch_fundamentals.py. One unacknowledged alert stands
      # until dismissed; dismissing it re-arms the alert for the next failure.
      # ----------------------------------------------------------------------
      - name: Alert on failure
        if: failure()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          docker run --rm postgres:17-alpine \
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "
              INSERT INTO job_failures (job_name, error_text)
              SELECT 'nightly_backup',
                     'Backup workflow failed — no new dump was committed. See GitHub Actions run ${{ github.run_id }}. Common causes: BACKUP_REPO_TOKEN expired, DB credentials rotated, backup repo renamed or branch-protected.'
              WHERE NOT EXISTS (
                SELECT 1 FROM job_failures
                WHERE job_name = 'nightly_backup' AND acknowledged_at IS NULL
              );
            " \
          || echo "::error::Backup failed AND the job_failures alert could not be written — the database itself is likely unreachable. Every scheduled job shares this credential, so assume all of them are failing."

# Residual gap, stated plainly: if the DATABASE is what is unreachable, the alert
# above cannot be written either — a failing job cannot report through the thing
# that is broken. That case is not silent in practice, because the dashboard also
# stops loading and the price-staleness banner fires as soon as it does load.
