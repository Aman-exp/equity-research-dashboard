name: Corporate actions fetch

# Stages splits and bonuses for watchlist companies as `unverified`, for review
# via v_pending_corporate_actions. These are load-bearing for correctness: without
# them a split or bonus silently breaks share counts and makes historical prices
# incomparable. See docs/design-corporate-identity.md.
#
# Weekly rather than daily — corporate actions are rare, ex-dates are announced
# well in advance, and this is 5 API calls per run.
#
# Required secret: SUPABASE_DB_URL — Supabase SESSION POOLER string, port 5432
# (the direct connection is IPv6-only on the free tier and unreachable from
# GitHub's IPv4-only runners). See docs/phase0-setup.md step 1.

on:
  schedule:
    - cron: '0 7 * * 6'          # Saturday 07:00 IST, markets closed
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

concurrency:
  # SHARED ACROSS ALL FOUR NSE-TOUCHING WORKFLOWS. NSE rate-limits by source, and
  # GitHub runners are datacenter IPs, so two of these jobs running at once
  # throttle each other — observed 2026-08-22, when an EOD backfill and the XBRL
  # job collided and NSE served HTML pages with HTTP 200 to both.
  #
  # cancel-in-progress: false, so a job WAITS rather than killing the one already
  # talking to NSE. Note GitHub keeps only ONE pending run per group: if two runs
  # queue behind a long backfill, the earlier pending one is cancelled. In normal
  # operation the schedules are 90+ minutes apart and never collide, so this only
  # matters during a manual backfill — run those outside 20:00-21:15 IST, or
  # re-trigger anything the Actions tab shows as cancelled. Every job here is
  # self-healing on the next run, so a skipped one loses nothing permanently.
  group: nse-api
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch corporate actions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/fetch_corporate_actions.py

# Newly staged actions do NOT take effect until confirmed — adj_factor() ignores
# unverified rows. The dashboard must surface v_pending_corporate_actions, or a
# real bonus will sit unapplied and quietly understate holdings.
