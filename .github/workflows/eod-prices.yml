name: EOD price + index fetch

# Downloads the UDiFF bhavcopy and the all-indices close file, and upserts
# watchlist prices into price_history / index_history.
#
# Verified 2026-08-15: both files are reachable from GitHub Actions runners
# (see .github/workflows/nse-endpoint-spike.yml).
#
# Required secret:
#   SUPABASE_DB_URL   Supabase SESSION POOLER connection string, port 5432
#                     (the direct connection is IPv6-only on the free tier and
#                     unreachable from GitHub's IPv4-only runners).
#                     Service-level credential — GitHub Secrets only.

on:
  schedule:
    # Market closes 15:30 IST; the bhavcopy lands early evening. 19:00 IST gives
    # plenty of margin. Weekdays only — weekends produce no file and exit cleanly.
    - cron: '0 19 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start (YYYY-MM-DD, optional)'
        required: false
      end_date:
        description: 'Backfill end (YYYY-MM-DD, optional)'
        required: false

concurrency:
  # SHARED ACROSS ALL FOUR NSE-TOUCHING WORKFLOWS. NSE rate-limits by source, and
  # GitHub runners are datacenter IPs, so two of these jobs running at once
  # throttle each other — observed 2026-08-22, when an EOD backfill and the XBRL
  # job collided and NSE served HTML pages with HTTP 200 to both.
  #
  # cancel-in-progress: false, so a job WAITS rather than killing the one already
  # talking to NSE. Note GitHub keeps only ONE pending run per group: if two runs
  # queue behind a long backfill, the earlier pending one is cancelled. In normal
  # operation the schedules are 90+ minutes apart and never collide, so this only
  # matters during a manual backfill — run those outside 20:00-21:15 IST, or
  # re-trigger anything the Actions tab shows as cancelled. Every job here is
  # self-healing on the next run, so a skipped one loses nothing permanently.
  group: nse-api
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch EOD prices and indices
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/fetch_eod.py ${{ inputs.start_date }} ${{ inputs.end_date }}

# On failure the script writes a row to job_failures itself before re-raising,
# so the dashboard banner surfaces it. GitHub does not notify on failed
# scheduled workflows — that banner is the only alerting mechanism.
